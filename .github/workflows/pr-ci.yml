name: PR CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Lint web
        run: corepack pnpm --filter @portfolio/web lint

      - name: Typecheck web
        run: corepack pnpm --filter @portfolio/web typecheck

      - name: Typecheck api
        run: corepack pnpm --filter api typecheck

      - name: Velite
        working-directory: apps/web
        run: npx velite build

      - name: Build web
        run: corepack pnpm --filter @portfolio/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          VELITE_STARTED: 1

      - name: Initial JS size
        run: corepack pnpm --filter @portfolio/web size

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Velite
        working-directory: apps/web
        run: npx velite build

      - name: Build web
        run: corepack pnpm --filter @portfolio/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          VELITE_STARTED: 1

      - name: Lighthouse
        working-directory: apps/web
        run: npx lhci autorun --config=./lighthouserc.json
